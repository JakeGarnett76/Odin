<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Links and Images</title>
    </head>
    <body>
        <h1>Homepage</h1>
        <!-- Absolute Link -->
        <!-- target="_blank" - opens in new page -->
        <!-- rel="noopener" - prevents opened page from accessing this page -->
        <!-- rel="noreferrer" - prevents new page from knowing where user came from (includes noopener)  -->
        <a href="https://www.theodinproject.com/about" target="_blank" rel="noopener noreferrer">About The Odin Project</a>

        <!-- Relative Link -->
        <a href="./pages/about.html">About</a>
        
        <img src="./images/dog.jpg" alt="The Dog" height="310" width="310">

    </body>
</html>
